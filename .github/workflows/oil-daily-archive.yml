name: Oil daily public-data archive

on:
  schedule:
    - cron: '15 8 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oil-daily-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect and archive dated source observations
        id: collect
        run: node scripts/daily-archive.mjs
      - name: Commit daily archive even when all sources fail
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive oil observations for $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
